# Hotels to scrape. One entry per hotel.
#
#   id          short unique key (used in the database)
#   micromarket id from micromarkets.yaml
#   company     listed company / operator the hotel gives a read on
#   source      booking engine adapter: synxis | reztrip | taj | marriott | hyatt
#   params      engine-specific identifiers (see each adapter's docstring)
#   rooms       standard rooms. A = entry category, B = next category up.
#               codes: exact room codes; names: case-insensitive regexes.
#               Omit to auto-pick the cheapest (A) and second-cheapest (B) rooms each day.
#               `python -m hps rooms <id>` prints the room list over 3 dates and a suggested block.
#               Rule used here: A = lowest room family on sale most of the time (few gaps),
#               B = next family up. Rarer entry rooms still feed LOWEST and the sold-out signal.
#   verified    false = not yet confirmed working; skipped by `run` unless
#               --include-unverified or --hotel is given. Taj/Marriott/Hyatt
#               start unverified because they block cloud servers; confirm them
#               on your own computer with `python -m hps test-site <source>`.
#
# SynXis chains:  ITC  https://res.itchotels.com chain 26676
#                 Leela https://reservations.theleela.com chain 23514
#                 Oberoi https://res.oberoihotels.com chain 24188
# List a chain's hotel ids:  python -m hps discover synxis <base_url> <chain>

hotels:
  # ------------------------------------------------------------ Mumbai - Airport
  - id: itc-maratha
    name: ITC Maratha, a Luxury Collection Hotel, Mumbai
    micromarket: mum-airport
    company: ITC Hotels
    segment: luxury
    source: synxis
    params: {base_url: "https://res.itchotels.com", chain: 26676, hotel: 30170}
    rooms:
      A: {codes: [TWDL]}   # Towers Double
      B: {codes: [I1DL]}   # ITC One Double

  - id: leela-mumbai
    name: The Leela Mumbai
    micromarket: mum-airport
    company: Schloss Bangalore (The Leela)
    segment: luxury
    source: synxis
    params: {base_url: "https://reservations.theleela.com", chain: 23514, hotel: 3158}
    verified: false   # SynXis works, but Leela's site blocked repeat visits from a cloud server

  - id: aurika-mumbai-airport
    name: Aurika, Mumbai International Airport
    micromarket: mum-airport
    company: Lemon Tree Hotels
    segment: upscale
    source: reztrip
    params: {code: BOMAUR}
    rooms:
      A: {codes: [DLXK]}   # Deluxe King Room
      B: {codes: [PRMK, PRMT]}   # Premium King / Twin

  - id: ltp-mumbai-airport
    name: Lemon Tree Premier, Mumbai International Airport
    micromarket: mum-airport
    company: Lemon Tree Hotels
    segment: upper midscale
    source: reztrip
    params: {code: BOMLTP}
    rooms:
      A: {names: ['^Deluxe Room']}
      B: {names: ['^Executive Room']}

  - id: jw-mumbai-sahar
    name: JW Marriott Mumbai Sahar
    micromarket: mum-airport
    company: Chalet Hotels (Marriott-operated)
    segment: luxury
    source: marriott
    params: {code: BOMSA}   # verify: marriott.com/.../hotels/<code>-jw-marriott-mumbai-sahar
    verified: false

  - id: taj-santacruz
    name: Taj Santacruz, Mumbai
